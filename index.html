<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pasanaco</title><meta name="theme-color" content="#0a0e14">
<style>
:root{color-scheme:dark;--bg:#0a0e14;--card:#131a24;--tx:#eaf0f7;--mut:#8593a6;--pri:#34d399;--ok:#34d399;--okb:#34d3991f;--bad:#fb7185;--badb:#fb71851f;--wn:#fbbf24;--wnb:#fbbf241f;--bd:#222c3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:20px;margin:6px 2px 12px}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.m{color:var(--mut);font-size:13px}.c{text-align:center}.f{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{width:28px;text-align:center;font-weight:700;color:var(--mut)}
.tg{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--bd);color:var(--mut);white-space:nowrap}
.tg.ok{background:var(--okb);color:var(--ok)}.tg.wn{background:var(--wnb);color:var(--wn)}.tg.bad{background:var(--badb);color:var(--bad)}
.b{display:block;width:100%;border:0;border-radius:10px;background:var(--pri);color:#fff;font:600 15px inherit;padding:12px;margin-top:8px;cursor:pointer;text-align:center}
:root[data-theme="dark"] .b{color:#06201c}
.b.g{background:transparent;color:var(--pri);border:1px solid var(--bd)}.b.s{width:auto;margin:0;padding:8px 12px;font-size:14px}
.i{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;width:34px;height:34px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}
label{display:block;margin-top:6px}
.nav2{display:flex;align-items:center;gap:8px;margin-bottom:10px}.nav2 .c{flex:1}
.pozo{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}.r{text-align:right}
.big{font-size:26px;font-weight:800;color:var(--pri)}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin-bottom:6px}.bar i{display:block;height:100%;background:var(--pri)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 11px inherit;cursor:pointer;padding:4px}nav button span{display:block;font-size:20px}nav button.on{color:var(--pri)}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.seg{display:flex;gap:8px;margin:10px 0}.seg button{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:none;color:var(--tx);font:600 14px inherit;cursor:pointer}.seg button.on{border-color:var(--pri);background:var(--okb);color:var(--pri)}
.qr{display:block;max-width:240px;width:70%;margin:6px auto;border-radius:10px;background:#fff}
.rc{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;margin:8px 0}a.b{text-decoration:none}.mx{border-collapse:collapse;font-size:13px}.mx th,.mx td{padding:6px 7px;text-align:center}.mx .nm{text-align:left;font-weight:600;position:sticky;left:0;background:var(--card)}#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;display:none;z-index:20}
body{background:radial-gradient(900px 420px at 80% -10%,#12324a66,transparent),var(--bg)}
.card{border-radius:18px}.row{border-radius:16px}
.b{color:#04231a;background:linear-gradient(135deg,#34d399,#22d3ee)}
.hero{background:linear-gradient(135deg,#0f3d3e,#14304f 60%,#1b2559);border:1px solid #2b4a63;box-shadow:0 10px 30px #0006}
.hero .big{color:#fff}.hero .m{color:#a9c1d6}.hero .i{border-color:#ffffff33;color:#fff}.hero .bar{background:#ffffff22}.hero .bar i{background:#34d399}
.av{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:linear-gradient(135deg,#1f3b57,#2a2f6b);color:#cfe3ff;flex:none}
nav{background:#0d131bd9;backdrop-filter:blur(14px)}
input,select,textarea{background:#0d131b}.seg button.on{background:#34d3991f}.ov{backdrop-filter:blur(3px)}
.login{text-align:center;max-width:360px;margin:12vh auto 0}.logo{font-size:44px;width:84px;height:84px;margin:0 auto 12px;border-radius:26px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#34d399,#22d3ee)}
.pb{height:5px;border-radius:9px;background:var(--bd);margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ok)}.pb i.w{background:var(--wn)}.pb i.p{background:#60a5fa}.av{cursor:pointer}.row{flex-wrap:wrap}.row .f{flex:1 1 140px}
</style></head><body>
<div id="app"></div><nav id="nav"></nav><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='pasanaco_v1',z=n=>String(n).padStart(2,'0');
const loc=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes());
const today=()=>loc(new Date()).slice(0,10);
let S={cfg:{nombre:'Mi Pasanaco',monto:100,freq:7,inicio:today(),hora:'20:00',umbral:80,multa:0,qr:''},people:[],pays:{}},tab='cobro',ronda=0,M={};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}norm();
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function save(){const j=JSON.stringify(S);try{localStorage.setItem(K,j)}catch(e){}if(cloud&&FB.push)FB.push(j).catch(()=>toast('Sin conexión, se guardará al volver'))}
const N=()=>S.people.length,key=(r,id)=>r+'-'+id;
const due=r=>{const[y,m,d]=S.cfg.inicio.split('-').map(Number),[h,mi]=S.cfg.hora.split(':').map(Number);return new Date(y,m-1,d+(r-1)*S.cfg.freq,h,mi)};
const curRound=()=>{let r=1;while(r<N()&&due(r)<new Date())r++;return r};
const fd=t=>new Date(t).toLocaleString('es-BO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const bs=n=>'Bs. '+Number(n).toLocaleString('es-BO');
const dur=ms=>{const m=Math.max(1,Math.round(ms/6e4));if(m<60)return m+' min';const h=Math.floor(m/60);return h<48?h+' h '+(m%60)+' min':Math.floor(h/24)+' d'};
function wa(r,p){let t=p.tel.replace(/\D/g,'');if(t.length==8)t='591'+t;return 'https://wa.me/'+t+'?text='+encodeURIComponent(`Hola ${p.name}, te recordamos tu cuota${sumA(abon(r,p.id))?' (te faltan '+bs(+(mon()-sumA(abon(r,p.id))).toFixed(2))+')':' de '+bs(S.cfg.monto)} del ${S.cfg.nombre} (ronda ${r}). Vence ${fd(due(r))}. Pagando a tiempo ganas puntos y prioridad para el próximo pasanaco 🏆`)}
function stats(p){let ok=0,tot=0,pts=0,od=0,st=0;const now=Date.now();for(let r=1;r<=N();r++){const y=S.pays[key(r,p.id)];if(y){tot++;if(y.ok){ok++;pts+=10;st++}else{pts+=2;st=0}}else if(due(r)<now){tot++;od++;st=0}}
const pct=tot?Math.round(ok/tot*100):null;return{pct,pts,od,st,elig:tot>0&&pct>=S.cfg.umbral&&od==0}}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){if(!ronda)ronda=curRound();if(window.FB&&FB.ok&&!user){$('#nav').innerHTML='';$('#app').innerHTML=vLogin();return}
$('#nav').innerHTML=[['cobro','💰','Cobros'],['gente','👥','Personas'],['rank','🏆','Ranking'],['cfg','⚙️','Ajustes']].map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
$('#app').innerHTML=({cobro:vCobro,gente:vGente,rank:vRank,cfg:vCfg})[tab]()}
function rr(d){ronda=Math.min(Math.max(ronda+d,1),N());render()}
function vCobro(){
if(!N())return `<div class="card c"><h2>Aún no hay participantes</h2><p class="m">Agrega a los miembros del pasanaco para empezar a cobrar.</p><button class="b" onclick="go('gente')">Agregar personas</button></div>`;
ronda=Math.min(Math.max(ronda,1),N());const r=ronda,rec=S.people[r-1],paid=S.people.filter(p=>S.pays[key(r,p.id)]),ok=paid.filter(p=>S.pays[key(r,p.id)].ok).length;
return `<h1>${esc(S.cfg.nombre)}</h1><div class="card hero"><div class="nav2"><button class="i" onclick="rr(-1)">‹</button><div class="c"><b>Ronda ${r} de ${N()}</b><div class="m">Vence ${fd(due(r))}</div></div><button class="i" onclick="rr(1)">›</button></div>
<div class="pozo"><div><div class="m">Pozo de la ronda</div><div class="big">${bs(S.cfg.monto*N())}</div></div><div class="r"><div class="m">Recibe</div><b>${rec.fijo||rec.sort?(rec.dueno?'👑 ':'')+esc(rec.name):'🎲 Por sortear'}</b></div></div>
<div class="bar"><i style="width:${Math.min(100,Math.round(gotR(r)/(mon()*N()||1)*100))}%"></i></div><div class="m">${paid.length} de ${N()} completaron · ${ok} a tiempo · recaudado ${bs(gotR(r))} de ${bs(mon()*N())}</div></div>${S.people.map(p=>row(r,p)).join('')}`}
const mon=()=>+S.cfg.monto||0,key2=(r,id)=>r+'-'+id;
const abon=(r,id)=>(S.parc&&S.parc[key2(r,id)])||[];
const sumA=a=>Math.round(a.reduce((t,x)=>t+x.mt,0)*100)/100;
const paidAmt=(r,id)=>S.pays[key2(r,id)]?mon():sumA(abon(r,id));
const gotR=r=>S.people.reduce((t,p)=>t+paidAmt(r,p.id),0);
const totG=()=>{let t=0;for(let k=1;k<=N();k++)t+=gotR(k);return t};
function row(r,p){const y=S.pays[key(r,p.id)],d=due(r),A=abon(r,p.id),got=y?mon():sumA(A),pc=Math.min(100,Math.round(got/(mon()||1)*100)),av=`<span class="av" title="Ver gráfico" onclick="ficha('${p.id}')">${esc(p.name[0])}</span>`,
pb=`<div class="pb"><i class="${y?(y.ok?'':'w'):(A.length?'p':'')}" style="width:${pc}%"></i></div>`;
if(y)return `<div class="row">${av}<div class="f"><b>${esc(p.name)}</b><div class="m">${y.m=='qr'?'QR':'Efectivo'} · ${fd(y.ts)}${y.ab&&y.ab.length>1?' · '+y.ab.length+' abonos':''}${y.n?' · Ref. '+esc(y.n):''}${!y.ok&&S.cfg.multa?' · multa '+bs(S.cfg.multa):''}</div>${pb}</div>${y.ok?'<span class="tg ok">A tiempo</span>':`<span class="tg wn">Tarde ${dur(y.ts-d.getTime())}</span>`}<button class="i" title="Comprobante" onclick="recibo(${r},'${p.id}')">🧾</button><button class="i" title="Anular pago" onclick="undo(${r},'${p.id}')">↺</button></div>`;
const late=d<new Date();
return `<div class="row">${av}<div class="f"><b>${esc(p.name)}</b><div class="m">${A.length?'Pagó '+bs(got)+' · falta '+bs(+(mon()-got).toFixed(2)):bs(mon())}${late&&S.cfg.multa?' + multa '+bs(S.cfg.multa):''}</div>${pb}</div>${late?`<span class="tg bad">Vencido ${dur(Date.now()-d)}</span>`:`<span class="tg">Vence en ${dur(d-Date.now())}</span>`}${A.length?`<button class="i" title="Quitar último abono" onclick="undo(${r},'${p.id}')">↺</button>`:''}${p.tel?`<a class="i" href="${wa(r,p)}" target="_blank" rel="noopener" title="Recordar por WhatsApp">💬</a>`:''}<button class="b s" onclick="openPay(${r},'${p.id}')">${A.length?'Abonar':'Cobrar'}</button></div>`}
function undo(r,id){const k=key(r,id);if(S.pays[k]){const y=S.pays[k];delete S.pays[k];if(y.ab&&y.ab.length>1){y.ab.pop();S.parc=S.parc||{};S.parc[k]=y.ab}}else if(S.parc&&S.parc[k]){S.parc[k].pop();if(!S.parc[k].length)delete S.parc[k]}save();render()}
function openPay(r,id){const rest=+(mon()-sumA(abon(r,id))).toFixed(2);M={r,id,m:S.cfg.qr?'qr':'efectivo',t:loc(new Date()),rest,a:rest};mod()}
function ficha(id){const p=S.people.find(x=>x.id==id),i=S.people.indexOf(p),r=ronda,got=paidAmt(r,id),m=mon(),s=stats(p),R=38,C=2*Math.PI*R,f=Math.min(1,got/(m||1)),bw=Math.min(34,Math.floor(280/Math.max(N(),1))-4);let bars='';
for(let k=1;k<=N();k++){const g=paidAmt(k,id),h=Math.round(Math.min(1,g/(m||1))*70),y=S.pays[key(k,id)],c=y?(y.ok?'#34d399':'#fbbf24'):g>0?'#60a5fa':due(k)<new Date()?'#fb7185':'#2a3544',x=(k-1)*(bw+4);
bars+=`<rect x="${x}" y="${80-h}" width="${bw}" height="${Math.max(h,3)}" rx="3" fill="${c}"/><text x="${x+bw/2}" y="94" font-size="9" text-anchor="middle" fill="#8593a6">${k}</text>`}
const L=(S.pays[key(r,id)]||{}).ab||abon(r,id);
$('#modal').innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="sh"><h2>${esc(p.name)}</h2><div class="m">${recv(i,p)}</div>
<div style="display:flex;align-items:center;gap:14px;margin:12px 0"><svg width="96" height="96" viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="none" stroke="#2a3544" stroke-width="12"/><circle cx="50" cy="50" r="${R}" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-dasharray="${f*C} ${C}" transform="rotate(-90 50 50)"/><text x="50" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#eaf0f7">${Math.round(f*100)}%</text></svg>
<div><div class="m">Cuota de la ronda ${r}</div><b>${bs(got)} de ${bs(m)}</b><div class="m">${got>=m?'Cuota completa':'Falta '+bs(+(m-got).toFixed(2))}</div><div class="m">Puntualidad: ${s.pct==null?'—':s.pct+'%'} · ${s.pts} pts</div></div></div>
<div class="m">Pago por ronda: verde a tiempo · amarillo tarde · azul parcial · rojo vencida</div><div style="overflow-x:auto"><svg width="${N()*(bw+4)}" height="100">${bars}</svg></div>
${L.length?'<div class="m" style="margin-top:8px">Abonos de esta ronda</div>'+L.map(x=>`<div class="m">• ${bs(x.mt)} · ${x.m=='qr'?'QR':'Efectivo'} · ${fd(x.ts)}${x.n?' · '+esc(x.n):''}</div>`).join(''):''}
<button class="b g" onclick="closeM()">Cerrar</button></div></div>`}
function mod(){const p=S.people.find(x=>x.id==M.id);$('#modal').innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="sh"><h2>Cobrar a ${esc(p.name)}</h2><div class="big">${bs(M.rest)}</div><div class="m">Cuota ${bs(S.cfg.monto)}${M.rest<mon()?' · ya pagó '+bs(+(mon()-M.rest).toFixed(2)):''}</div>
<div class="seg"><button class="${M.m=='qr'?'on':''}" onclick="sm('qr')">📱 QR</button><button class="${M.m=='efectivo'?'on':''}" onclick="sm('efectivo')">💵 Efectivo</button></div>
${M.m=='qr'?(S.cfg.qr?`<img class="qr" src="${S.cfg.qr}" alt="QR de pago"><p class="m c">Muestra este QR y confirma cuando veas el pago en tu banco.</p>`:'<p class="m">Aún no subiste tu QR de cobro. Ve a Ajustes → Mi QR de cobro.</p>'):''}
<label class="m">Monto que paga ahora (Bs.)</label><input id="ma" type="number" min="0.01" step="any" value="${M.a}" oninput="prev()"><div class="seg" style="margin-top:0"><button onclick="$('#ma').value=${M.rest};prev()">Completo</button><button onclick="$('#ma').value=${+(M.rest/2).toFixed(2)};prev()">Mitad</button></div><label class="m">Fecha y hora del pago</label><input id="mt" type="datetime-local" value="${M.t}" onchange="prev()"><div id="pv"></div><label class="m">Referencia / nota (opcional)</label><input id="mn" placeholder="N.º de transacción, detalle…" value="${esc(M.n||'')}">
<button class="b" onclick="okPay()">Confirmar pago</button><button class="b g" onclick="closeM()">Cancelar</button></div></div>`;prev()}
function sm(m){M.a=$('#ma').value;M.t=$('#mt').value;M.n=$('#mn').value;M.m=m;mod()}
function prev(){M.t=$('#mt').value;const t=new Date(M.t).getTime(),a=parseFloat($('#ma').value)||0;if(isNaN(t))return;const f=+(M.rest-a).toFixed(2);
$('#pv').innerHTML=f>0?`<span class="tg wn">Abono parcial · falta ${bs(f)}</span>`:t<=due(M.r).getTime()?'<span class="tg ok">✓ Completa la cuota a tiempo · +10 pts</span>':'<span class="tg wn">Completa la cuota fuera de hora · +2 pts'+(S.cfg.multa?' · multa '+bs(S.cfg.multa):'')+'</span>'}
function okPay(){const t=new Date($('#mt').value).getTime(),a=Math.round((parseFloat($('#ma').value)||0)*100)/100;if(isNaN(t))return toast('Pon fecha y hora');if(a<=0)return toast('Pon el monto');if(a>M.rest)return toast('Supera lo que falta ('+bs(M.rest)+')');
S.parc=S.parc||{};const k=key(M.r,M.id),L=S.parc[k]=S.parc[k]||[];L.push({ts:t,m:M.m,mt:a,n:$('#mn').value.trim()});
if(sumA(L)>=mon()){const ts=Math.max(...L.map(x=>x.ts));S.pays[k]={ts,m:L[L.length-1].m,ok:ts<=due(M.r).getTime(),n:L.map(x=>x.n).filter(Boolean).join(' / '),ab:L};delete S.parc[k];save();closeM();render();recibo(M.r,M.id)}
else{save();closeM();render();toast('Abono registrado · falta '+bs(+(M.rest-a).toFixed(2)))}}
function closeM(){$('#modal').innerHTML=''}
function recibo(r,id){const p=S.people.find(x=>x.id==id),y=S.pays[key(r,id)];if(!y)return;const s=stats(p),mu=!y.ok&&S.cfg.multa?S.cfg.multa:0,
txt=`🧾 Comprobante — ${S.cfg.nombre}\nParticipante: ${p.name}\nRonda: ${r} de ${N()}\nMonto: ${bs(S.cfg.monto)}${y.ab&&y.ab.length>1?'\nAbonos: '+y.ab.map(x=>bs(x.mt)+' ('+fd(x.ts)+')').join(', '):''}${mu?'\nMulta por mora: '+bs(mu):''}\nMétodo: ${y.m=='qr'?'QR':'Efectivo'}${y.n?'\nRef.: '+y.n:''}\nPagado: ${fd(y.ts)}\nEstado: ${y.ok?'✅ A tiempo (+10 pts)':'⏰ Fuera de hora (+2 pts)'}\nPuntualidad: ${s.pct}% · ${s.pts} pts`;
let t=(p.tel||'').replace(/\D/g,'');if(t.length==8)t='591'+t;
$('#modal').innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="sh"><h2>Pago registrado ✅</h2><pre class="rc">${esc(txt)}</pre><a class="b" target="_blank" rel="noopener" href="https://wa.me/${t}?text=${encodeURIComponent(txt)}">Enviar comprobante por WhatsApp</a><button class="b g" onclick="closeM()">Cerrar</button></div></div>`}
function graf(){const m=mon()*N(),cur=curRound(),bw=Math.min(34,Math.floor(300/N())-4);let b='';
for(let k=1;k<=N();k++){const g=gotR(k),h=Math.round(Math.min(1,g/(m||1))*80),x=(k-1)*(bw+4);
b+=`<rect x="${x}" y="0" width="${bw}" height="80" rx="3" fill="#222c3a"/><rect x="${x}" y="${80-h}" width="${bw}" height="${g?Math.max(h,3):0}" rx="3" fill="${k==cur?'#22d3ee':'#34d399'}"/><text x="${x+bw/2}" y="94" font-size="9" text-anchor="middle" fill="#8593a6">${k}</text>`}
const tg=totG();
return `<h2 style="margin-top:14px">Avance general</h2><div class="card"><div class="pozo"><div><div class="m">Recaudado en total</div><div class="big">${bs(tg)}</div></div><div class="r"><div class="m">Meta total</div><b>${bs(m*N())}</b></div></div><div class="bar"><i style="width:${Math.min(100,Math.round(tg/((m*N())||1)*100))}%"></i></div><div class="m">Cada barra es una ronda: lo recaudado frente a lo esperado (${bs(m)}). La ronda actual va en celeste.</div><div style="overflow-x:auto;margin-top:8px"><svg width="${N()*(bw+4)}" height="100">${b}</svg></div></div>`}
function matriz(){const now=Date.now(),v=Object.values(S.pays),tarde=v.filter(y=>!y.ok).length,mu=S.cfg.multa||0;let h='<h2 style="margin-top:14px">Matriz de pagos</h2><div class="card" style="overflow-x:auto;padding:8px"><table class="mx"><tr><th></th>';
for(let r=1;r<=N();r++)h+=`<th title="${fd(due(r))}">${r}</th>`;h+='</tr>';
S.people.forEach(p=>{h+=`<tr><td class="nm">${esc(p.name.split(' ')[0])}</td>`;for(let r=1;r<=N();r++){const y=S.pays[key(r,p.id)];h+=`<td>${y?(y.ok?'✅':'⏰'):abon(r,p.id).length?'🟡':due(r)<now?'❌':'·'}</td>`}h+='</tr>'});
return h+`</table></div><p class="m">✅ a tiempo · ⏰ tarde · 🟡 abono parcial · ❌ vencida sin pagar · · en plazo</p><div class="card"><b>Recaudado total: ${bs(totG()+tarde*mu)}</b><div class="m">${v.length} cuotas pagadas · ${tarde} tarde${mu?' · multas '+bs(tarde*mu):''}</div></div>`}
function bk(){const t=$('#bkt');t.value=JSON.stringify({...S,cfg:{...S.cfg,qr:''}});t.select();try{document.execCommand('copy');toast('Respaldo copiado')}catch(e){}}
function rs(){try{const d=JSON.parse($('#bkt').value);if(!d.cfg||!d.people||!d.pays)throw 0;d.cfg.qr=d.cfg.qr||S.cfg.qr;S=d;save();ronda=0;go('cobro');toast('Restaurado')}catch(e){toast('Respaldo no válido')}}
const dd=t=>new Date(t).toLocaleDateString('es-BO',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
const recv=(i,p)=>p.fijo||p.sort?'Recibe el '+dd(due(i+1))+' (ronda '+(i+1)+')':'Fecha por sortear';
function norm(){S.people.forEach(p=>{if(p.sort===undefined&&p.fijo===undefined){p.sort=true;p.fijo=false}})}
function vGente(){const np=S.people.filter(p=>!p.fijo).length;return `<h1>Personas</h1><div class="card"><input id="pn" placeholder="Nombre completo"><input id="pt" type="tel" placeholder="Celular (opcional, para recordar por WhatsApp)"><label class="m">¿Cómo recibe?</label><select id="pm"><option value="s">🎲 Entra al sorteo</option><option value="f">🔒 Ya tiene su lugar (fijo)</option><option value="d">👑 Dueño del pasanaco (recibe primero)</option></select><input id="pk" type="number" min="1" placeholder="N.º de turno (solo si es lugar fijo)"><button class="b" onclick="addP()">Agregar al pasanaco</button>${N()?'':'<button class="b g" onclick="demo()">Cargar ejemplo</button>'}</div>
${S.people.map((p,i)=>`<div class="row"><span class="n">${i+1}</span><div class="f"><b>${p.dueno?'👑 ':''}${esc(p.name)}</b><div class="m">${p.fijo?'🔒 Lugar fijo':p.sort?'🎲 Sorteado':'🎲 Entra al sorteo'} · ${recv(i,p)}</div>${p.tel?`<div class="m">${esc(p.tel)}</div>`:''}</div><button class="i" title="Cambiar: lugar fijo / entra al sorteo" onclick="tgF('${p.id}')">${p.fijo?'🔒':'🎲'}</button><button class="i" onclick="mv(${i},-1)">↑</button><button class="i" onclick="mv(${i},1)">↓</button><button class="i" onclick="delP('${p.id}',this)">✕</button></div>`).join('')}
${np?`<button class="b g" onclick="shuf()">🎲 Sortear turnos (${np} participan)</button>`:''}<p class="m">🔒 ya tiene su lugar y no entra al sorteo · 🎲 entra al sorteo. La fecha es el día límite de la ronda en que recibe el pozo.</p>`}
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function addP(){const n=$('#pn').value.trim();if(!n)return toast('Escribe el nombre');const m=$('#pm').value,k=parseInt($('#pk').value),p={id:nid(),name:n,tel:$('#pt').value.trim(),fijo:m!='s',sort:m!='s'};
if(m=='d'){p.dueno=true;S.people.unshift(p)}else if(m=='f'&&k>0)S.people.splice(Math.min(k,N()+1)-1,0,p);else S.people.push(p);save();render()}
function mv(i,d){const j=i+d;if(j<0||j>=N())return;const a=S.people[i],b=S.people[j];if(!a.fijo&&b.fijo)return toast('Ese lugar es fijo, no se puede mover');[S.people[i],S.people[j]]=[b,a];if(!a.fijo)a.sort=true;save();render()}
function tgF(id){const p=S.people.find(x=>x.id==id);p.fijo=!p.fijo;p.sort=p.fijo;if(!p.fijo)delete p.dueno;save();render()}
function shuf(){const idx=[],pool=[];S.people.forEach((p,i)=>{if(!p.fijo){idx.push(i);pool.push(p)}});
for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
idx.forEach((k,n)=>{S.people[k]=pool[n];pool[n].sort=true});save();render();toast('Sorteo realizado')}
function delP(id,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='¿Seguro?';b.style.width='auto';b.style.padding='0 8px';return}S.people=S.people.filter(p=>p.id!=id);[S.pays,S.parc||{}].forEach(o=>Object.keys(o).forEach(k=>{if(k.split('-')[1]==id)delete o[k]}));save();render()}
function demo(){['Ana Rojas','Luis Mamani','María Justiniano','Carlos Vaca','Rosa Pinto','Juan Salvatierra'].forEach((n,i)=>S.people.push({id:nid(),name:n,tel:'',fijo:!i,sort:!i,dueno:!i}));save();render()}
function vRank(){let pr=0;const L=S.people.map(p=>({p,...stats(p)})).sort((a,b)=>(b.pct??-1)-(a.pct??-1)||b.pts-a.pts);
return `<h1>Ranking de puntualidad</h1><div class="card m">A tiempo = +10 pts · Tarde = +2 pts. Sube al siguiente pasanaco con prioridad quien tenga ${S.cfg.umbral}% o más de puntualidad y ninguna cuota vencida.</div>
${L.length?L.map((x,i)=>`<div class="row"><span class="n">${['🥇','🥈','🥉'][i]||i+1}</span><div class="f"><b>${esc(x.p.name)}</b><div class="m">${x.pct==null?'Sin cuotas todavía':x.pct+'% puntual · '+x.pts+' pts'+(x.od?' · '+x.od+' vencida(s)':'')+(x.st>1?' · 🔥 '+x.st+' seguidas':'')}</div></div>${x.elig?`<span class="tg ok">⭐ Sube #${++pr}</span>`:'<span class="tg">En proceso</span>'}</div>`).join(''):'<p class="m">Agrega personas para ver el ranking.</p>'}${N()?graf()+matriz():''}`}
function vCfg(){const c=S.cfg;return `<h1>Ajustes</h1><div class="card"><label class="m">Nombre del pasanaco</label><input value="${esc(c.nombre)}" onchange="cf('nombre',this.value)">
<label class="m">Monto de la cuota (Bs.)</label><input type="number" min="1" value="${c.monto}" onchange="cf('monto',+this.value)">
<label class="m">Frecuencia</label><select onchange="cf('freq',+this.value)">${[[7,'Semanal'],[15,'Quincenal'],[30,'Mensual (30 días)']].map(([v,l])=>`<option value="${v}" ${c.freq==v?'selected':''}>${l}</option>`).join('')}</select>
<label class="m">Fecha de la primera ronda</label><input type="date" value="${c.inicio}" onchange="cf('inicio',this.value)">
<label class="m">Hora límite de pago</label><input type="time" value="${c.hora}" onchange="cf('hora',this.value)">
<label class="m">Puntualidad mínima para subir (%)</label><input type="number" min="1" max="100" value="${c.umbral}" onchange="cf('umbral',+this.value)"><label class="m">Multa por pago tarde (Bs., 0 = sin multa)</label><input type="number" min="0" value="${c.multa||0}" onchange="cf('multa',+this.value)"></div>
<div class="card"><h2>Mi QR de cobro</h2><p class="m">Sube la imagen del QR de tu banco para mostrarla al cobrar.</p>${c.qr?`<img class="qr" src="${c.qr}" alt="QR"><button class="b g" onclick="S.cfg.qr='';save();render()">Quitar QR</button>`:''}<input type="file" accept="image/*" onchange="upQR(this)"></div>
${cloud?'<button class="b g" onclick="FB.logout()">Cerrar sesión</button>':''}<div class="card"><h2>Respaldo</h2><p class="m">Copia tus datos para guardarlos o pasarlos a otro dispositivo.</p><button class="b g" onclick="bk()">Generar respaldo</button><textarea id="bkt" rows="3" placeholder="Aquí aparece el respaldo. Para restaurar, pega uno y toca Restaurar."></textarea><button class="b g" onclick="rs()">Restaurar</button></div><button class="b g" onclick="rst(this)">Borrar todos los datos</button><p class="m">${cloud?'☁️ Sincronizado en la nube':'Modo local: los datos se guardan solo en este dispositivo.'}</p>`}
function cf(k,v){S.cfg[k]=v;save();ronda=0;toast('Guardado')}
function upQR(inp){const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);S.cfg.qr=c.toDataURL('image/jpeg',.88);save();render()};im.src=fr.result};fr.readAsDataURL(f)}
function rst(b){if(!b.dataset.s){b.dataset.s=1;b.textContent='¿Seguro? Toca otra vez para borrar todo';return}S.people=[];S.pays={};S.parc={};S.cfg.qr='';save();ronda=0;go('cobro')}
let user=null,cloud=false,unsub=null;
function vLogin(){return `<div class="login"><div class="logo">💰</div><h1>Pasanaco</h1><p class="m">Ingresa para administrar los pagos</p><input id="le" type="email" placeholder="Correo" autocomplete="username"><input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="b" onclick="doLogin()">Ingresar</button></div>`}
function doLogin(){FB.login($('#le').value.trim(),$('#lp').value).catch(()=>toast('Correo o contraseña incorrectos'))}
function start(){if(window.started)return;window.started=1;if(!window.FB||!FB.ok){render();return}cloud=true;
FB.watch(u=>{user=u;if(unsub){unsub();unsub=null}
if(u)unsub=FB.sub((d,pend,err)=>{if(err){toast('Sin permisos o sin conexión');return}
if(d==null){FB.push(JSON.stringify(S));return}if(pend)return;
try{S=JSON.parse(d);localStorage.setItem(K,d)}catch(e){}norm();
const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&!$('#modal').innerHTML)render()});
render()})}
if(window.FB)start();else{addEventListener('fbready',start);$('#app').innerHTML='<p class="m c" style="margin-top:40px">Cargando…</p>';setTimeout(()=>{if(!window.FB)start()},7000)}
</script>
